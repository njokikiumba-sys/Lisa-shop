<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Lisa Shop</title>
<link rel="stylesheet" href="style.css">
<style>
  .signup-box { max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
  .signup-box h2 { text-align: center; margin-bottom: 20px; }
  .signup-box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
  .signup-box button { width: 100%; padding: 12px; background: #e91e63; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .error { color: red; text-align: center; display: none; margin-top: 10px; }
</style>
</head>
<body>
<header><h1>🛍️ Lisa Shop</h1><nav><a href="index.html">Home</a></nav></header>
<div class="signup-box">
  <h2>Create Account</h2>
  <input type="text" id="name" placeholder="Full Name">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <p class="error" id="error">This email is already used!</p>
  <p style="text-align:center; margin-top:15px;">Already have an account? <a href="login.html">Login</a></p>
</div>
<script>
function signup() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  if (!name || !email || !pass) { alert('Please fill all fields'); return; }
  let users = JSON.parse(localStorage.getItem('lisaUsers') || '[]');
  if (users.find(u => u.email === email)) {
    document.getElementById('error').style.display = 'block';
    return;
  }
  users.push({ name, email, password: pass, role: 'customer' });
  localStorage.setItem('lisaUsers', JSON.stringify(users));
  alert('Account created! Now login.');
  window.location.href = 'login.html';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Lisa Shop</title>
<link rel="stylesheet" href="style.css">
<style>
  .login-box { max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
  .login-box h2 { text-align: center; margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
  .login-box button { width: 100%; padding: 12px; background: #e91e63; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .login-box button:hover { background: #c2185b; }
  .error { color: red; text-align: center; display: none; margin-top: 10px; }
  .hint { text-align: center; font-size: 13px; color: #777; margin-top: 15px; }
</style>
</head>
<body>

<header>
  <h1>🛍️ Lisa Shop</h1>
  <nav><a href="index.html">Home</a></nav>
</header>

<div class="login-box">
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p class="error" id="error">Wrong email or password!</p>
  <p class="hint">Don't have an account? <a href="signup.html">Sign Up</a></p>
  <p class="hint">Admin test: admin@lisashop.com / admin123</p>
</div>

<script>
function login() {
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;

  // Get users from storage
  let users = JSON.parse(localStorage.getItem('lisaUsers') || '[]');

  // Make sure admin always exists
  if (!users.find(u => u.email === 'admin@lisashop.com')) {
    users.push({ name: 'Admin', email: 'admin@lisashop.com', password: 'admin123', role: 'admin' });
    localStorage.setItem('lisaUsers', JSON.stringify(users));
  }

  const user = users.find(u => u.email === email && u.password === pass);

  if (!user) {
    document.getElementById('error').style.display = 'block';
    return;
  }

  localStorage.setItem('currentUser', JSON.stringify(user));

  // IMPORTANT: No / in front! This keeps you inside Lisa-shop folder
  if (user.email === 'admin@lisashop.com' || user.role === 'admin') {
    window.location.href = 'admin.html';
  } else {
    window.location.href = 'index.html';
  }
}
</script>
</body>
</html>
